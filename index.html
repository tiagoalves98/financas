<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Finanças</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen pb-12">

  <!-- Header -->
  <header class="p-6 bg-gray-800 border-b border-gray-700 flex justify-between items-center sticky top-0 z-10">
    <div>
      <h1 class="text-xl font-bold">Minhas Finanças</h1>
      <p class="text-xs text-gray-400" id="mes-atual">A carregar...</p>
    </div>
    <button onclick="carregarDados()" class="p-2 bg-gray-700 rounded-full text-gray-300 hover:text-white transition active:scale-95">
      <i class="fa-solid fa-rotate" id="icon-refresh"></i>
    </button>
  </header>

  <main class="p-4 space-y-6 max-w-lg mx-auto">

    <!-- Resumo dos Saldos -->
    <div class="grid grid-cols-3 gap-3">
      <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700">
        <p class="text-xs text-gray-400">Ganhos</p>
        <p class="text-base font-semibold text-emerald-400 mt-1 truncate" id="total-ganhos">0,00 €</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700">
        <p class="text-xs text-gray-400">Despesas</p>
        <p class="text-base font-semibold text-rose-400 mt-1 truncate" id="total-despesas">0,00 €</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-2xl border border-gray-700">
        <p class="text-xs text-gray-400">Balanço</p>
        <p class="text-base font-bold text-white mt-1 truncate" id="balanco-total">0,00 €</p>
      </div>
    </div>

    <!-- Lista de Movimentos -->
    <div>
      <h2 class="text-md font-semibold text-gray-300 mb-3">Movimentos do Mês</h2>
      <div id="lista-movimentos" class="space-y-3">
        <p class="text-center text-gray-500 py-8">A carregar registos...</p>
      </div>
    </div>

  </main>

  <script>
    // URL do teu Google Apps Script já inserido
    const API_URL = "https://script.google.com/macros/s/AKfycbxg1FUh5S_swGjIb1iZ73tiGhICEx0mWthbjns7wUEoDutHHw6KIvbS6hkLkE7sxnLC0w/exec";

    const dataAtual = new Date();
    document.getElementById('mes-atual').innerText = dataAtual.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });

    async function carregarDados() {
      const listaEl = document.getElementById('lista-movimentos');
      const iconRefresh = document.getElementById('icon-refresh');
      
      iconRefresh.classList.add('fa-spin');
      listaEl.innerHTML = '<p class="text-center text-gray-500 py-8">A atualizar...</p>';
      
      try {
        const res = await fetch(API_URL);
        const dados = await res.json();

        let totalGanhos = 0;
        let totalDespesas = 0;
        listaEl.innerHTML = '';

        if (!dados || dados.length === 0) {
          listaEl.innerHTML = '<p class="text-center text-gray-500 py-8">Nenhum registo encontrado.</p>';
          iconRefresh.classList.remove('fa-spin');
          return;
        }

        // Filtrar apenas o mês e ano atual
        const anoAtual = dataAtual.getFullYear();
        const mesAtualIndex = dataAtual.getMonth();

        const dadosMes = dados.filter(item => {
          if (!item.data) return false;
          const partesData = item.data.split('-'); // Espera formato YYYY-MM-DD
          if (partesData.length < 2) return true; // Se vier noutrom formato, mostra por defeito
          const itemAno = parseInt(partesData[0]);
          const itemMes = parseInt(partesData[1]) - 1;
          return itemAno === anoAtual && itemMes === mesAtualIndex;
        });

        // Se quiseres ver todos os registos independentemente do mês, podes alterar "dadosMes" para "dados"
        const registosParaMostrar = dadosMes.length > 0 ? dadosMes : dados;

        registosParaMostrar.reverse().forEach(item => {
          const valor = parseFloat(item.valor) || 0;
          const tipoStr = (item.tipo || '').toString().toLowerCase();
          const isGanho = tipoStr === 'ganho' || tipoStr === 'receita' || tipoStr === 'ordenado';

          if (isGanho) totalGanhos += valor;
          else totalDespesas += valor;

          const card = document.createElement('div');
          card.className = "bg-gray-800 p-4 rounded-2xl border border-gray-700 flex justify-between items-center";
          
          card.innerHTML = `
            <div class="flex items-center space-x-3 overflow-hidden">
              <div class="w-10 h-10 rounded-full flex-shrink-0 flex items-center justify-center ${isGanho ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}">
                <i class="fa-solid ${isGanho ? 'fa-arrow-down' : 'fa-arrow-up'}"></i>
              </div>
              <div class="truncate">
                <p class="font-medium text-sm text-white truncate">${item.descricao || item.categoria || 'Sem descrição'}</p>
                <p class="text-xs text-gray-400">${item.data} • ${item.categoria || 'Geral'}</p>
              </div>
            </div>
            <p class="font-semibold text-sm flex-shrink-0 ml-2 ${isGanho ? 'text-emerald-400' : 'text-rose-400'}">
              ${isGanho ? '+' : '-'}${valor.toFixed(2)} €
            </p>
          `;
          listaEl.appendChild(card);
        });

        document.getElementById('total-ganhos').innerText = `${totalGanhos.toFixed(2)} €`;
        document.getElementById('total-despesas').innerText = `${totalDespesas.toFixed(2)} €`;
        
        const balanco = totalGanhos - totalDespesas;
        const balancoEl = document.getElementById('balanco-total');
        balancoEl.innerText = `${balanco.toFixed(2)} €`;
        balancoEl.className = `text-base font-bold mt-1 truncate ${balanco >= 0 ? 'text-emerald-400' : 'text-rose-400'}`;

      } catch (err) {
        listaEl.innerHTML = '<p class="text-center text-rose-400 py-8">Erro ao carregar dados da folha.</p>';
      } finally {
        iconRefresh.classList.remove('fa-spin');
      }
    }

    carregarDados();
  </script>
</body>
</html>
